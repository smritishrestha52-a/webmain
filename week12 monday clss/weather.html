<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Week 12 React useEffect weather dashboard assignment." />
  <title>Week 12 | Weather Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #202b46; --muted: #71809b; --blue: #6c9fce; --blue-dark: #477eaf;
      --sky: #eaf4ff; --lav: #f1efff; --pink: #fff0f4; --white: #fff;
      --line: #e6edf6; --shadow: 0 22px 60px rgba(73, 104, 145, .12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--ink); font-family: "DM Sans", sans-serif;
      background: radial-gradient(circle at 8% 8%, #e5f3ff 0, transparent 32%),
                  radial-gradient(circle at 92% 12%, #f2eaff 0, transparent 30%),
                  linear-gradient(135deg, #f8fbff, #fbf9ff 58%, #fff8fa);
    }
    button, input { font: inherit; }
    .page { width: min(1050px, calc(100% - 36px)); margin: 0 auto; padding: 34px 0 54px; }
    header { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:28px; }
    .brand { display:flex; align-items:center; gap:12px; font-weight:700; letter-spacing:.02em; }
    .brand-mark { display:grid; place-items:center; width:42px; height:42px; border-radius:14px; color:#fff; background:linear-gradient(145deg,#8fc2e9,#9b9be0); box-shadow:0 8px 20px #91b8df66; font-size:21px; }
    .course { color:var(--muted); font-size:12px; font-weight:700; letter-spacing:.13em; text-transform:uppercase; }
    .hero { display:flex; justify-content:space-between; align-items:end; gap:20px; margin:34px 0 24px; }
    h1 { font-family:"Playfair Display",serif; font-size:clamp(34px,5vw,52px); line-height:1.08; margin:8px 0 10px; letter-spacing:-.03em; }
    .subtitle { color:var(--muted); margin:0; line-height:1.65; max-width:550px; }
    .pill { padding:9px 14px; border:1px solid #dce9f8; border-radius:99px; color:var(--blue-dark); background:#ffffffb8; font-size:12px; font-weight:700; white-space:nowrap; }
    .search-card { display:flex; flex-wrap:wrap; gap:10px; padding:14px; border:1px solid #e4edf8; border-radius:20px; background:#ffffffd9; box-shadow:0 10px 30px #8099bb12; }
    .search-card input { flex:1 1 230px; min-width:0; padding:14px 16px; border:1px solid var(--line); border-radius:13px; outline:none; color:var(--ink); background:#fbfdff; }
    .search-card input:focus { border-color:#91bce2; box-shadow:0 0 0 3px #dceeff; }
    .btn { border:0; border-radius:13px; padding:13px 18px; cursor:pointer; font-weight:700; transition:.2s; }
    .btn:hover { transform:translateY(-1px); }
    .btn-primary { color:white; background:linear-gradient(135deg,#6fa8d8,#858bd4); box-shadow:0 8px 18px #7d9fd344; }
    .btn-soft { color:#527ba7; background:#edf5ff; }
    .hint { color:var(--muted); font-size:12px; margin:10px 4px 0; }
    .status { min-height:28px; margin:18px 3px 8px; color:var(--muted); font-size:14px; }
    .error { padding:13px 16px; color:#a34865; background:#fff0f4; border:1px solid #f7d9e2; border-radius:13px; }
    .weather-card { display:grid; grid-template-columns:1.2fr .8fr; gap:20px; margin-top:12px; padding:clamp(22px,4vw,38px); border:1px solid #e4edf8; border-radius:28px; background:linear-gradient(125deg,#fff 0%,#f4f9ff 55%,#f7f4ff 100%); box-shadow:var(--shadow); }
    .location { color:var(--muted); font-weight:600; }
    .temp-line { display:flex; align-items:center; gap:16px; margin:16px 0 8px; }
    .weather-icon { font-size:clamp(50px,8vw,76px); filter:drop-shadow(0 8px 10px #a4b8d333); }
    .temp { font-size:clamp(56px,9vw,86px); font-weight:700; letter-spacing:-.07em; line-height:1; }
    .condition { color:#536782; font-size:18px; font-weight:600; }
    .updated { color:#98a5b9; font-size:12px; margin-top:14px; }
    .metrics { display:grid; grid-template-columns:1fr 1fr; gap:12px; align-content:center; }
    .metric { padding:19px; border:1px solid #e7edf6; border-radius:18px; background:#ffffffc9; }
    .metric-label { color:var(--muted); font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; }
    .metric-value { margin-top:8px; font-size:25px; font-weight:700; }
    .metric-icon { float:right; font-size:20px; }
    .footer { display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-top:22px; color:#9aa7bb; font-size:12px; }
    .loading { display:flex; align-items:center; gap:10px; }
    .spinner { width:16px; height:16px; border:2px solid #d7e6f6; border-top-color:#6b9fce; border-radius:50%; animation:spin .8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @media(max-width:700px) { .hero { align-items:start; flex-direction:column; } .weather-card { grid-template-columns:1fr; } .metrics { grid-template-columns:1fr 1fr; } header { align-items:start; } }
    @media(max-width:420px) { .page { width:calc(100% - 24px); padding-top:22px; } .metrics { gap:8px; } .metric { padding:14px; } .metric-value { font-size:21px; } .pill { white-space:normal; } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
    const { useEffect, useState } = React;

    const weatherDescriptions = {
      0: ["Clear sky", "☀️"], 1: ["Mainly clear", "🌤️"], 2: ["Partly cloudy", "⛅"],
      3: ["Overcast", "☁️"], 45: ["Fog", "🌫️"], 48: ["Depositing rime fog", "🌫️"],
      51: ["Light drizzle", "🌦️"], 53: ["Moderate drizzle", "🌦️"], 55: ["Dense drizzle", "🌧️"],
      56: ["Light freezing drizzle", "🌧️"], 57: ["Dense freezing drizzle", "🌧️"],
      61: ["Slight rain", "🌦️"], 63: ["Moderate rain", "🌧️"], 65: ["Heavy rain", "🌧️"],
      66: ["Light freezing rain", "🌧️"], 67: ["Heavy freezing rain", "🌧️"],
      71: ["Slight snow", "🌨️"], 73: ["Moderate snow", "❄️"], 75: ["Heavy snow", "❄️"],
      77: ["Snow grains", "❄️"], 80: ["Rain showers", "🌦️"], 81: ["Moderate showers", "🌧️"],
      82: ["Violent showers", "⛈️"], 85: ["Snow showers", "🌨️"], 86: ["Heavy snow showers", "🌨️"],
      95: ["Thunderstorm", "⛈️"], 96: ["Thunderstorm with hail", "⛈️"], 99: ["Thunderstorm with heavy hail", "⛈️"]
    };

    function WeatherDashboard() {
      const [input, setInput] = useState("Seoul");
      const [search, setSearch] = useState({ type: "city", value: "Seoul", key: 0 });
      const [weather, setWeather] = useState(null);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState("");

      useEffect(() => {
        if (!search) return;
        const controller = new AbortController();

        async function loadWeather() {
          setLoading(true);
          setError("");
          setWeather(null);
          try {
            let latitude, longitude, placeName;

            if (search.type === "coords") {
              [latitude, longitude] = search.value.split(",").map(Number);
              if (!Number.isFinite(latitude) || !Number.isFinite(longitude) ||
                  latitude < -90 || latitude > 90 || longitude < -180 || longitude > 180) {
                throw new Error("Please enter valid coordinates (latitude, longitude).");
              }
              placeName = `${latitude.toFixed(2)}, ${longitude.toFixed(2)}`;
            } else {
              const geoUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(search.value)}&count=1&language=en&format=json`;
              const geoResponse = await fetch(geoUrl, { signal: controller.signal });
              if (!geoResponse.ok) throw new Error("Could not search for that city. Please try again.");
              const geoData = await geoResponse.json();
              if (!geoData.results || geoData.results.length === 0) {
                throw new Error("City not found. Check the spelling or try another city.");
              }
              const place = geoData.results[0];
              latitude = place.latitude;
              longitude = place.longitude;
              placeName = [place.name, place.admin1, place.country].filter(Boolean).join(", ");
            }

            const url = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m&wind_speed_unit=kmh&timezone=auto`;
            const response = await fetch(url, { signal: controller.signal });
            if (!response.ok) throw new Error("Weather service is unavailable. Please try again.");
            const data = await response.json();
            if (!data.current) throw new Error("Weather data was not available for this location.");
            setWeather({ ...data.current, placeName, units: data.current_units });
          } catch (err) {
            if (err.name !== "AbortError") setError(err.message || "Something went wrong. Please try again.");
          } finally {
            if (!controller.signal.aborted) setLoading(false);
          }
        }

        loadWeather();
        return () => controller.abort();
      }, [search]);

      function handleSearch(event) {
        event.preventDefault();
        const value = input.trim();
        if (!value) { setError("Please enter a city or coordinates."); return; }
        const isCoords = /^-?\d+(\.\d+)?\s*,\s*-?\d+(\.\d+)?$/.test(value);
        setSearch({ type: isCoords ? "coords" : "city", value, key: Date.now() });
      }

      function useMyLocation() {
        if (!navigator.geolocation) {
          setError("Geolocation is not supported by this browser.");
          return;
        }
        setLoading(true);
        setError("");
        navigator.geolocation.getCurrentPosition(
          position => {
            const { latitude, longitude } = position.coords;
            setInput(`${latitude.toFixed(4)}, ${longitude.toFixed(4)}`);
            setSearch({ type: "coords", value: `${latitude},${longitude}`, key: Date.now() });
          },
          () => {
            setLoading(false);
            setError("Location access was denied or unavailable. You can search by city instead.");
          },
          { enableHighAccuracy: false, timeout: 10000 }
        );
      }

      const code = weather?.weather_code;
      const condition = weatherDescriptions[code] || ["Current conditions", "🌍"];

      return (
        <main className="page">
          <header>
            <div className="brand"><div className="brand-mark">☁</div><span>Cloudnine <span style={{color:"#7b9fc7"}}>Weather</span></span></div>
            <div className="course">Gachon University · Web Programming</div>
          </header>

          <section className="hero">
            <div>
              <div className="course">Week 12 · React Effects & useEffect</div>
              <h1>Your little weather<br/>corner.</h1>
              <p className="subtitle">A calm, simple forecast dashboard. Search a city or enter coordinates to see the latest weather.</p>
            </div>
            <div className="pill">✦ Powered by Open-Meteo · No API key</div>
          </section>

          <form className="search-card" onSubmit={handleSearch}>
            <input aria-label="City or coordinates" value={input} onChange={e => setInput(e.target.value)}
              placeholder="Try Seoul or 37.5665, 126.9780" />
            <button className="btn btn-primary" type="submit">Search weather</button>
            <button className="btn btn-soft" type="button" onClick={useMyLocation}>◎ Use my location</button>
          </form>
          <p className="hint">Tip: enter a city name, or latitude and longitude separated by a comma.</p>

          <div className="status" aria-live="polite">
            {loading && <span className="loading"><span className="spinner"></span> Finding your forecast…</span>}
            {!loading && error && <div className="error" role="alert">{error}</div>}
          </div>

          {weather && !loading && (
            <section className="weather-card" aria-label="Current weather">
              <div>
                <div className="location">CURRENT WEATHER · {weather.placeName}</div>
                <div className="temp-line">
                  <span className="weather-icon" aria-hidden="true">{condition[1]}</span>
                  <div className="temp">{Math.round(weather.temperature_2m)}°</div>
                </div>
                <div className="condition">{condition[0]}</div>
                <div className="updated">Feels like {Math.round(weather.apparent_temperature)}° · Updated {weather.time.replace("T", " ")}</div>
              </div>
              <div className="metrics">
                <div className="metric"><span className="metric-icon">💨</span><div className="metric-label">Wind speed</div><div className="metric-value">{weather.wind_speed_10m} <small>km/h</small></div></div>
                <div className="metric"><span className="metric-icon">💧</span><div className="metric-label">Humidity</div><div className="metric-value">{weather.relative_humidity_2m}<small>%</small></div></div>
                <div className="metric"><span className="metric-icon">🌧️</span><div className="metric-label">Precipitation</div><div className="metric-value">{weather.precipitation}<small> mm</small></div></div>
                <div className="metric"><span className="metric-icon">🌡️</span><div className="metric-label">Feels like</div><div className="metric-value">{Math.round(weather.apparent_temperature)}<small>°C</small></div></div>
              </div>
            </section>
          )}

          <div className="footer">
            <span>Made for Week 12 · React + useEffect + AbortController</span>
            <span>Weather data: Open-Meteo</span>
          </div>
        </main>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<WeatherDashboard />);
  </script>
</body>
</html>
