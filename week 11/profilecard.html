
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week 11 - Profile Card</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
body {
    font-family: Arial, sans-serif;
    background: #eaf4ff;
    padding: 50px 20px;
    text-align: center;
}
.profile {
    background: white;
    padding: 30px;
    border-radius: 16px;
    max-width: 350px;
    margin: 30px auto;
    box-shadow: 0 4px 15px #cbd9e8;
}
h2 { color: #3478b9; }
.verified { color: #16865b; font-weight: bold; }
</style>
</head>
<body>
<h1>React Profile Card</h1>
<div id="root"></div>

<script type="text/babel">
function App() {
    return (
        <ProfileCard
            name="Smriti Shrestha"
            role="Computer Engineering Student"
            followers={1240}
            isVerified={true}
        />
    );
}

function ProfileCard({ name, role, followers, isVerified }) {
    return (
        <div className="profile">
            <h2>
                {name}
                {isVerified && <span className="verified"> ✓ Verified</span>}
            </h2>
            <p>{role}</p>
            <p>{followers.toLocaleString()} followers</p>
        </div>
    );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
