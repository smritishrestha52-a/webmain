
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Color Palette Card</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f1f5f9;
      padding: 30px;
    }

    h1 {
      text-align: center;
      color: #1e293b;
    }

    .palette {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .color {
      width: 140px;
      padding: 25px 10px;
      border-radius: 10px;
      text-align: center;
      color: white;
      font-weight: bold;
    }

    .green {
      background-color: #15803d;
    }

    .blue {
      background-color: #2563eb;
    }

    .purple {
      background-color: #7c3aed;
    }

    .orange {
      background-color: #ea580c;
    }
  </style>
</head>
<body>
  <h1>My Color Palette</h1>

  <div class="palette">
    <div class="color green">Green<br>#15803d</div>
    <div class="color blue">Blue<br>#2563eb</div>
    <div class="color purple">Purple<br>#7c3aed</div>
    <div class="color orange">Orange<br>#ea580c</div>
  </div>
</body>
</html>
