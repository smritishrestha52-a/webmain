
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlobePulse | Shrestha Smriti</title>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Nunito', sans-serif;
    background: linear-gradient(135deg, #edf6ff, #f5f0ff, #fff1f7);
    color: #263650;
    min-height: 100vh;
    padding: 35px 18px;
}

.container {
    max-width: 1050px;
    margin: auto;
}

header {
    text-align: center;
    margin-bottom: 32px;
}

.eyebrow {
    display: inline-block;
    background: #e4edff;
    color: #5879c5;
    padding: 7px 16px;
    border-radius: 30px;
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 2px;
    margin-bottom: 14px;
}

h1 {
    font-size: clamp(38px, 7vw, 58px);
    font-weight: 900;
    color: #344e83;
    letter-spacing: -2px;
}

h1 span {
    color: #a58bdc;
}

.subtitle {
    color: #78869d;
    font-size: 16px;
    margin-top: 8px;
}

.explorer {
    background: rgba(255,255,255,0.8);
    border: 1px solid #e5eafa;
    border-radius: 25px;
    padding: 25px;
    box-shadow: 0 12px 40px rgba(76, 99, 145, 0.08);
}

.section-label {
    font-size: 12px;
    color: #8995ad;
    font-weight: 900;
    letter-spacing: 1.8px;
    margin-bottom: 13px;
}

.category-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 20px;
}

.category-btn {
    border: 1px solid #e0e7f5;
    background: #f7f9ff;
    color: #61718d;
    padding: 11px 17px;
    border-radius: 13px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    transition: 0.2s;
}

.category-btn:hover {
    transform: translateY(-2px);
    background: #edf1ff;
}

.category-btn.active {
    background: #dce8ff;
    color: #405f9c;
    border-color: #b9ccf4;
}

.controls {
    display: flex;
    gap: 10px;
    margin-bottom: 25px;
}

#searchInput {
    flex: 1;
    min-width: 0;
    padding: 13px 16px;
    border: 1px solid #dfe6f3;
    border-radius: 12px;
    font-family: inherit;
    font-size: 14px;
    outline: none;
    background: #fbfcff;
}

#searchInput:focus {
    border-color: #9bb4ee;
    box-shadow: 0 0 0 3px #eaf0ff;
}

.clear-btn {
    border: none;
    background: #fceaf1;
    color: #b46f91;
    border-radius: 12px;
    padding: 12px 19px;
    font-family: inherit;
    font-weight: 800;
    cursor: pointer;
}

.clear-btn:hover {
    background: #f8dce8;
}

.results-heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 17px;
}

.results-heading h2 {
    font-size: 21px;
    color: #3e5279;
}

.count {
    color: #8b96aa;
    font-size: 13px;
    font-weight: 800;
}

.country-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px;
}

.country-card {
    background: #fff;
    border: 1px solid #e8edf7;
    border-radius: 18px;
    padding: 20px;
    transition: 0.2s;
    box-shadow: 0 5px 16px rgba(66, 85, 125, 0.04);
}

.country-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 25px rgba(66, 85, 125, 0.10);
    border-color: #cbd9f6;
}

.country-top {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 7px;
}

.flag {
    font-size: 30px;
}

.country-card h3 {
    font-size: 19px;
    color: #34496f;
    font-weight: 900;
}

.location {
    color: #8994a8;
    font-size: 13px;
    margin-left: 43px;
    margin-bottom: 18px;
}

.population {
    font-size: 23px;
    font-weight: 900;
    color: #718fd0;
    margin-bottom: 12px;
}

.population small {
    font-size: 13px;
    color: #9aa5b8;
    font-weight: 800;
}

.stats {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.stat {
    background: #f0f4ff;
    color: #687da9;
    padding: 7px 10px;
    border-radius: 9px;
    font-size: 12px;
    font-weight: 800;
}

.stat:nth-child(2) {
    background: #fff0f5;
    color: #b77d98;
}

.stat:nth-child(3) {
    background: #f0edff;
    color: #8b7bb7;
}

.empty {
    text-align: center;
    padding: 40px 10px;
    color: #8994a8;
    grid-column: 1 / -1;
}

footer {
    text-align: center;
    color: #929db0;
    font-size: 13px;
    margin-top: 28px;
    padding-bottom: 10px;
}

footer strong {
    color: #7189bd;
}

@media (max-width: 650px) {
    body {
        padding: 22px 12px;
    }

    .explorer {
        padding: 17px;
    }

    .country-grid {
        grid-template-columns: 1fr;
    }

    .category-btn {
        flex: 1 1 45%;
        padding: 10px 8px;
    }

    .controls {
        flex-wrap: wrap;
    }

    #searchInput {
        flex-basis: 100%;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <div class="eyebrow">✦ GLOBAL DATA & INDICATORS</div>
    <h1>Globe<span>Pulse</span></h1>
    <p class="subtitle">Explore country statistics across four global domains.</p>
</header>

<main class="explorer">

    <div class="section-label">✦ DATA EXPLORER</div>

    <p class="section-label">Choose a data category</p>

    <div class="category-buttons">
        <button class="category-btn active" data-category="demographics">👥 Demographics</button>
        <button class="category-btn" data-category="economics">📈 Economics</button>
        <button class="category-btn" data-category="technology">⚡ Tech & Web</button>
        <button class="category-btn" data-category="environment">🌱 Eco & Energy</button>
    </div>

    <div class="controls">
        <input
            type="text"
            id="searchInput"
            placeholder="Search for a country..."
            aria-label="Search countries"
        >
        <button class="clear-btn" id="clearBtn">Clear</button>
    </div>

    <div class="results-heading">
        <h2 id="categoryTitle">👥 Demographics</h2>
        <span class="count" id="countryCount">8 countries</span>
    </div>

    <div class="country-grid" id="countryGrid"></div>

</main>
<footer>
    Created by <strong>Shrestha Smriti</strong> | Week 6 - Friday Task 6
</footer>


</div>

<script>
const countries = [
    {
        name: "United States",
        flag: "🇺🇸",
        capital: "Washington, D.C.",
        region: "Americas",
        demographics: ["👥 334,914,895", "36/km²", "Age 38.5", "Urban 83%"],
        economics: ["GDP $27.4T", "GDP/capita $81,695", "Inflation 4.1%"],
        technology: ["Internet 92%", "Mobile 110%", "Tech Index High"],
        environment: ["Renewables 21%", "CO₂ 4.9 tons/person", "Forest 33%"]
    },
    {
        name: "South Korea",
        flag: "🇰🇷",
        capital: "Seoul",
        region: "East Asia",
        demographics: ["👥 51,741,963", "516/km²", "Age 44.8", "Urban 81%"],
        economics: ["GDP $1.7T", "GDP/capita $33,121", "Inflation 3.6%"],
        technology: ["Internet 97%", "Mobile 120%", "Tech Index High"],
        environment: ["Renewables 9%", "CO₂ 11.5 tons/person", "Forest 63%"]
    },
    {
        name: "India",
        flag: "🇮🇳",
        capital: "New Delhi",
        region: "South Asia",
        demographics: ["👥 1,428,627,663", "435/km²", "Age 28.7", "Urban 36%"],
        economics: ["GDP $3.6T", "GDP/capita $2,485", "Inflation 5.7%"],
        technology: ["Internet 52%", "Mobile 82%", "Tech Index Growing"],
        environment: ["Renewables 22%", "CO₂ 1.9 tons/person", "Forest 24%"]
    },
    {
        name: "Germany",
        flag: "🇩🇪",
        capital: "Berlin",
        region: "Europe",
        demographics: ["👥 84,482,267", "236/km²", "Age 45.7", "Urban 77%"],
        economics: ["GDP $4.5T", "GDP/capita $54,291", "Inflation 6.0%"],
        technology: ["Internet 93%", "Mobile 128%", "Tech Index High"],
        environment: ["Renewables 52%", "CO₂ 7.2 tons/person", "Forest 32%"]
    },
    {
        name: "Japan",
        flag: "🇯🇵",
        capital: "Tokyo",
        region: "East Asia",
        demographics: ["👥 124,516,650", "330/km²", "Age 48.6", "Urban 92%"],
        economics: ["GDP $4.2T", "GDP/capita $33,950", "Inflation 3.3%"],
        technology: ["Internet 94%", "Mobile 170%", "Tech Index High"],
        environment: ["Renewables 22%", "CO₂ 8.5 tons/person", "Forest 68%"]
    },
    {
        name: "Nepal",
        flag: "🇳🇵",
        capital: "Kathmandu",
        region: "South Asia",
        demographics: ["👥 30,547,580", "207/km²", "Age 25.3", "Urban 22%"],
        economics: ["GDP $41B", "GDP/capita $1,337", "Inflation 7.7%"],
        technology: ["Internet 50%", "Mobile 130%", "Tech Index Developing"],
        environment: ["Renewables 98%", "CO₂ 0.5 tons/person", "Forest 45%"]
    },
    {
        name: "Brazil",
        flag: "🇧🇷",
        capital: "Brasília",
        region: "Americas",
        demographics: ["👥 216,422,446", "25/km²", "Age 33.5", "Urban 87%"],
        economics: ["GDP $2.2T", "GDP/capita $10,412", "Inflation 4.6%"],
        technology: ["Internet 84%", "Mobile 100%", "Tech Index Growing"],
        environment: ["Renewables 89%", "CO₂ 2.3 tons/person", "Forest 59%"]
    },
    {
        name: "United Kingdom",
        flag: "🇬🇧",
        capital: "London",
        region: "Europe",
        demographics: ["👥 67,736,802", "279/km²", "Age 40.6", "Urban 84%"],
        economics: ["GDP $3.3T", "GDP/capita $48,900", "Inflation 7.3%"],
        technology: ["Internet 96%", "Mobile 120%", "Tech Index High"],
        environment: ["Renewables 42%", "CO₂ 4.6 tons/person", "Forest 13%"]
    }
];

const categoryInfo = {
    demographics: {
        title: "👥 Demographics",
        heading: "Population"
    },
    economics: {
        title: "📈 Economics",
        heading: "Economic indicators"
    },
    technology: {
        title: "⚡ Tech & Web",
        heading: "Technology indicators"
    },
    environment: {
        title: "🌱 Eco & Energy",
        heading: "Environmental indicators"
    }
};

let currentCategory = "demographics";

const grid = document.getElementById("countryGrid");
const searchInput = document.getElementById("searchInput");
const count = document.getElementById("countryCount");
const title = document.getElementById("categoryTitle");

function renderCountries() {
    const searchText = searchInput.value.trim().toLowerCase();

    const filteredCountries = countries.filter(country =>
        country.name.toLowerCase().includes(searchText)
    );

    title.textContent = categoryInfo[currentCategory].title;
    count.textContent = `${filteredCountries.length} countries`;

    if (filteredCountries.length === 0) {
        grid.innerHTML = `
            <div class="empty">
                <h3>No countries found 🌍</h3>
                <p>Try searching with another country name.</p>
            </div>
        `;
        return;
    }

    grid.innerHTML = filteredCountries.map(country => {
        const stats = country[currentCategory];

        return `
            <article class="country-card">
                <div class="country-top">
                    <span class="flag">${country.flag}</span>
                    <h3>${country.name}</h3>
                </div>

                <p class="location">
                    ${country.capital} · ${country.region}
                </p>

                <div class="population">
                    ${stats[0]}
                    <small>${currentCategory === "demographics" ? "people" : ""}</small>
                </div>

                <div class="stats">
                    ${stats.slice(1).map(stat =>
                        `<span class="stat">${stat}</span>`
                    ).join("")}
                </div>
            </article>
        `;
    }).join("");
}

document.querySelectorAll(".category-btn").forEach(button => {
    button.addEventListener("click", () => {
        document.querySelectorAll(".category-btn").forEach(btn =>
            btn.classList.remove("active")
        );

        button.classList.add("active");
        currentCategory = button.dataset.category;
        renderCountries();
    });
});

searchInput.addEventListener("input", renderCountries);

document.getElementById("clearBtn").addEventListener("click", () => {
    searchInput.value = "";
    renderCountries();
});

renderCountries();
</script>

</body>
</html>
