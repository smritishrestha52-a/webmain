<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap');

* {
    box-sizing: border-box;
    scroll-behavior: smooth;
}

body {
    margin: 0;
    font-family: 'DM Sans', sans-serif;
    color: #35483b;
    background: #f6f4ec;
}

/* HERO */
header {
    position: relative;
    overflow: hidden;
    padding: 100px 20px 90px;
    text-align: center;
    background:
        radial-gradient(circle at 12% 20%, #ffffff 0 3%, transparent 25%),
        radial-gradient(circle at 90% 80%, #cbd8c2 0 4%, transparent 24%),
        linear-gradient(130deg, #d8e3d1, #f1eddf 60%, #e7d9c9);
    border-radius: 0 0 55px 55px;
}

header::before {
    content: "✳";
    position: absolute;
    left: 9%;
    top: 35px;
    color: #9aaa8c;
    font-size: 65px;
}

header::after {
    content: "✳";
    position: absolute;
    right: 10%;
    bottom: 20px;
    color: #bd9272;
    font-size: 55px;
}

.tag {
    display: inline-block;
    padding: 9px 19px;
    border-radius: 30px;
    background: #fffdf6;
    color: #718568;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 2px;
}

header h1 {
    margin: 22px 0 8px;
    color: #294b39;
    font-family: 'Playfair Display', serif;
    font-size: clamp(42px, 7vw, 68px);
    letter-spacing: -1px;
}

header h2 {
    margin: 8px 0;
    color: #718568;
    font-size: clamp(19px, 3vw, 25px);
    font-weight: 600;
}

header p {
    color: #7c8977;
    font-size: 14px;
}

/* NAVIGATION */
nav {
    position: sticky;
    top: 8px;
    z-index: 10;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 7px;
    max-width: 1100px;
    margin: 22px auto 38px;
    padding: 13px;
    background: #fffdf7ed;
    border: 1px solid #e4e3d8;
    border-radius: 22px;
    box-shadow: 0 8px 25px #334b3512;
    backdrop-filter: blur(12px);
}

nav a {
    padding: 8px 13px;
    border-radius: 20px;
    color: #61745d;
    text-decoration: none;
    font-size: 12px;
    font-weight: 800;
    transition: .2s;
}

nav a:hover {
    background: #dce7d5;
    color: #294b39;
}

/* MAIN CONTENT */
main {
    width: 92%;
    max-width: 1080px;
    margin: auto;
}

.intro {
    text-align: center;
    margin-bottom: 40px;
    padding: 12px 15px;
}

.intro h2 {
    color: #294b39;
    font-family: 'Playfair Display', serif;
    font-size: 30px;
}

.intro p {
    color: #879184;
    line-height: 1.8;
    max-width: 620px;
    margin: auto;
}

/* WEEK SECTIONS */
.week,
.week-section {
    margin-bottom: 26px;
    padding: 29px;
    background: #fffdf8;
    border: 1px solid #e7e4d9;
    border-top: 4px solid #9eaf91;
    border-radius: 23px;
    box-shadow: 0 9px 25px #344a3510;
    scroll-margin-top: 100px;
}

.week-heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 18px;
}

.week-heading h2 {
    margin: 0;
    color: #294b39;
    font-family: 'Playfair Display', serif;
    font-size: 23px;
}

.week-label {
    padding: 7px 13px;
    border-radius: 25px;
    background: #e9eee2;
    color: #718568;
    font-size: 11px;
    font-weight: 800;
}

.week-description {
    color: #879184;
    font-size: 13px;
    line-height: 1.7;
}

/* TASK LINKS */
.tasks {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
}

.tasks a {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 16px;
    min-height: 54px;
    background: #f1f3e9;
    border: 1px solid #e1e7d9;
    border-radius: 14px;
    color: #526b50;
    text-decoration: none;
    font-size: 13px;
    font-weight: 800;
    transition: .22s;
}

.tasks a:hover {
    transform: translateY(-4px);
    background: #e4ecdc;
    border-color: #b9c9ad;
    box-shadow: 0 7px 15px #344a3510;
}

.tasks a span {
    color: #b98260;
}

.week-page {
    display: inline-block;
    margin-top: 17px;
    padding: 10px 16px;
    background: #e7ecdf;
    border-radius: 12px;
    color: #456348;
    text-decoration: none;
    font-size: 12px;
    font-weight: 800;
}

/* PROJECT CARDS */
.project-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 14px;
}

.project-card {
    display: flex;
    flex-direction: column;
    min-height: 165px;
    padding: 21px;
    background: #f7f6ef;
    border: 1px solid #e6e4d9;
    border-radius: 18px;
    color: #46564b;
    text-decoration: none;
    transition: .22s;
}

.project-card:hover {
    transform: translateY(-5px);
    background: #edf1e7;
    border-color: #b7c8aa;
    box-shadow: 0 10px 20px #344a3512;
}

.project-card strong,
.project-card h4 {
    color: #294b39;
}

.project-card p {
    color: #879184;
    font-size: 13px;
    line-height: 1.65;
}

.project-card small {
    margin-top: auto;
    color: #a87555;
    font-weight: 800;
}

/* WEEK 11 AND WEEK 12 */
.section-heading {
    text-align: left;
    margin-bottom: 22px;
}

.section-label {
    color: #a87555;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1.7px;
}

.section-heading h2 {
    color: #294b39;
    font-family: 'Playfair Display', serif;
    font-size: 27px;
    margin: 7px 0;
}

.section-heading p {
    color: #879184;
    font-size: 13px;
}

.week-part {
    padding: 19px;
    margin-top: 15px;
    background: #f4f4eb;
    border: 1px solid #e4e6d9;
    border-radius: 17px;
}

.week-part h3 {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    color: #294b39;
    font-size: 17px;
    margin: 0 0 15px;
}

.week-part h3 span,
.project-number {
    color: #718568;
    background: #e5ebdd;
    border-radius: 20px;
    padding: 6px 10px;
    font-size: 11px;
    font-weight: 800;
}

.project-card h4 {
    color: #294b39;
    margin: 8px 0 3px;
}

.project-link {
    margin-top: auto;
    color: #a87555;
    font-size: 12px;
    font-weight: 800;
}

.week12-highlight {
    border: 1px solid #c4d2b8;
    background: linear-gradient(135deg, #edf2e7, #fffdf8);
}

.week12-highlight strong {
    font-size: 16px;
}

.week12-note {
    display: inline-block;
    margin: 0 0 12px;
    padding: 6px 10px;
    border-radius: 20px;
    background: #f0e3d8;
    color: #9b6d50;
    font-size: 11px;
    font-weight: 800;
}

/* FOOTER */
footer {
    margin-top: 55px;
    padding: 42px 15px;
    text-align: center;
    background: linear-gradient(120deg, #dce5d4, #eee7d9);
    color: #71806e;
    border-radius: 35px 35px 0 0;
    font-size: 13px;
    line-height: 1.8;
}

footer strong {
    color: #294b39;
}

/* MOBILE */
@media(max-width:650px) {
    header {
        padding: 65px 16px;
    }

    header::before {
        left: 3%;
        font-size: 40px;
    }

    header::after {
        right: 4%;
        font-size: 38px;
    }

    nav {
        margin: 14px 9px 28px;
    }

    nav a {
        padding: 7px 9px;
        font-size: 11px;
    }

    main {
        width: 94%;
    }

    .week,
    .week-section {
        padding: 20px;
    }

    .week-heading h2 {
        font-size: 20px;
    }

    .tasks,
    .project-grid {
        grid-template-columns: 1fr;
    }
}
</style>
